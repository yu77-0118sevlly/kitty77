<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WUYO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <!-- 全局隐藏的图片上传控件 -->
    <input type="file" id="image-uploader" accept="image/*">

    <!-- 主屏幕容器 -->
    <main id="home-screen">
        
        <!-- 顶部品牌与日期区 (固定不滑动) -->
        <header class="top-header">
            <div class="header-left">
                <div class="brand-name">WUYO</div>
                <div class="date-display">
                    <span class="day" id="current-day">星期四</span>
                    <span class="date" id="current-date">9月3日</span>
                </div>
            </div>
            <div class="header-right">
                <!-- 支持上传的主页图片 -->
                <div class="profile-widget uploadable" id="profile-pic">
                    <i data-lucide="user" class="placeholder-icon"></i>
                </div>
            </div>
        </header>

        <!-- 桌面滑动分页区 -->
        <div class="desktop-swiper" id="desktop-swiper">
            
            <!-- ====== 第一页 ====== -->
            <div class="desktop-page">
                <!-- 第一页小组件 (2x2 网格) -->
                <div class="widget-grid">
                    
                    <!-- Memory 拍立得组件 -->
                    <div class="widget widget-square">
                        <div class="polaroid-inner">
                            <div class="polaroid-img uploadable" id="memory-pic">
                                <i data-lucide="image" class="placeholder-icon"></i>
                            </div>
                            <div class="polaroid-bottom">
                                <span class="polaroid-tag">MEMORY</span>
                                <span class="polaroid-desc">美好的瞬间</span>
                            </div>
                        </div>
                    </div>

                    <!-- Clock 时间组件 -->
                    <div class="widget widget-square flex-center col-layout">
                        <div class="clock-time" id="widget-time">09:41</div>
                        <div class="clock-date" id="widget-date-sub">9月3日</div>
                    </div>

                    <!-- Today 今日组件 -->
                    <div class="widget widget-square flex-center col-layout today-widget">
                        <div class="today-title">TODAY</div>
                        <div class="today-text">保持专注，<br>顺其自然。</div>
                    </div>

                    <!-- Weather 天气组件 -->
                    <div class="widget widget-square flex-center col-layout weather-widget">
                        <i data-lucide="cloud" class="weather-icon"></i>
                        <div class="weather-temp">18°</div>
                        <div class="weather-city">Tokyo / Cloudy</div>
                    </div>
                </div>

                <!-- 第一页 App 网格 (8个) -->
                <div class="app-grid">
                    <div class="app-item"><div class="app-icon"><i data-lucide="book"></i></div><span>世界书</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="palette"></i></div><span>美化</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="image"></i></div><span>相册</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="file-text"></i></div><span>备忘录</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="music"></i></div><span>音乐</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="calendar"></i></div><span>日历</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="settings"></i></div><span>设置</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="heart"></i></div><span>情侣空间</span></div>
                </div>
            </div>

            <!-- ====== 第二页 ====== -->
            <div class="desktop-page">
                <!-- 第二页小组件 -->
                <div class="widget-grid">
                    
                    <!-- 音乐组件 (横向占两格) -->
                    <div class="widget widget-wide music-widget">
                        <div class="music-cover uploadable" id="music-cover">
                            <i data-lucide="music" class="placeholder-icon"></i>
                        </div>
                        <div class="music-info">
                            <div class="music-title">Midnight City</div>
                            <div class="music-artist">M83</div>
                        </div>
                        <div class="music-play"><i data-lucide="play-circle"></i></div>
                    </div>

                    <!-- 照片组件 -->
                    <div class="widget widget-square photo-widget uploadable" id="photo-widget">
                        <i data-lucide="camera" class="placeholder-icon"></i>
                    </div>

                    <!-- 情侣组件 -->
                    <div class="widget widget-square flex-center col-layout couple-widget">
                        <div class="couple-heart">♡</div>
                        <div class="couple-days">99 Days</div>
                    </div>
                </div>

                <!-- 第二页 App 网格 (8个) -->
                <div class="app-grid">
                    <div class="app-item"><div class="app-icon"><i data-lucide="scan-search"></i></div><span>查手机</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="smartphone"></i></div><span>小手机</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="message-circle"></i></div><span>短信</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="book-open"></i></div><span>阅读</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="clock"></i></div><span>时钟</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="map"></i></div><span>地图</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="brain"></i></div><span>记忆总结</span></div>
                    <div class="app-item"><div class="app-icon"><i data-lucide="gamepad-2"></i></div><span>小游戏</span></div>
                </div>
            </div>

        </div>

        <!-- 分页指示点 -->
        <div class="pagination-dots" id="pagination-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <!-- 极简 Dock 栏 -->
        <nav id="dock">
            <div class="dock-container">
                <div class="dock-item"><div class="dock-icon"><i data-lucide="phone"></i></div></div>
                <div class="dock-item"><div class="dock-icon"><i data-lucide="users"></i></div></div>
                <div class="dock-item"><div class="dock-icon"><i data-lucide="message-square"></i></div></div>
                <div class="dock-item"><div class="dock-icon"><i data-lucide="layout-grid"></i></div></div>
            </div>
        </nav>

    </main>

    <script src="app.js"></script>
</body>
</html>
