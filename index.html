<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>简约白 AI 主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg-color: #ffffff; --card-bg: #fafafa; --icon-bg: #f7f7f7; --text-primary: #1a1a1a; --text-secondary: #777; --text-muted: #999; --border-color: #f0f0f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #e8e8e8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 0; color: var(--text-primary); overflow: hidden; }
        .phone-screen { width: 100%; max-width: 100vw; height: 100vh; height: 100dvh; background: var(--bg-color); border-radius: 0; box-shadow: none; display: flex; flex-direction: column; position: relative; overflow: hidden; background-size: cover; background-position: center; }
        @media (min-width: 768px) { .phone-screen { max-width: 430px; height: 90vh; height: 90dvh; border-radius: 20px; box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 20px 40px -10px rgba(0,0,0,0.15); } }
        .main-scroll-container { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; background: transparent; scrollbar-width: none; -ms-overflow-style: none; }
        .main-scroll-container::-webkit-scrollbar { display: none; }
        .page { flex: 0 0 100%; width: 100%; overflow-y: auto; scroll-snap-align: start; display: flex; flex-direction: column; background: transparent; padding-bottom: 8px; position: relative; }
        .top-spacer { height: 14px; flex-shrink: 0; }
        .profile-card { display: flex; align-items: center; gap: 12px; padding: 14px; margin: 4px 10px 6px; background: var(--card-bg); border-radius: 16px; cursor: pointer; }
        .profile-avatar-wrapper { width: 50px; height: 50px; cursor: pointer; flex-shrink: 0; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #777; cursor: pointer; border: 2px solid #fff; background-size: cover; background-position: center; }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 600; font-size: 16px; cursor: pointer; }
        .profile-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; cursor: pointer; }
        .edit-badge { background: #f0f0f0; padding: 4px 10px; font-size: 11px; color: #666; cursor: pointer; border: none; border-radius: 20px; }
        .couple-card { display: flex; align-items: center; justify-content: space-around; gap: 16px; padding: 16px; margin: 8px 10px 4px; background: var(--card-bg); border-radius: 16px; cursor: pointer; }
        .couple-person { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .couple-avatar { width: 56px; height: 56px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #777; border: 2px solid #fff; background-size: cover; background-position: center; }
        .couple-name { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
        .couple-heart svg { width: 32px; height: 32px; stroke: #ccc; stroke-width: 1.5; fill: none; }
        .glass-component { margin: 8px 10px 4px; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.5); }
        .glass-text { font-size: 13px; color: #444; cursor: pointer; background: rgba(255,255,255,0.6); padding: 5px 10px; border-radius: 20px; display: inline-block; }
        .glass-image-area { width: 100%; height: 120px; background: #ececec; border-radius: 12px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #999; background-size: cover; background-position: center; font-size: 14px; }
        .apps-grid { display: flex; flex-direction: column; gap: 16px; padding: 10px 8px 4px; }
        .app-row { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 12px; padding: 0 4px; min-height: 60px; }
        .app-item { display: flex; flex-direction: column; align-items: center; width: 62px; cursor: pointer; background: transparent; border: none; }
        .app-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--icon-bg); margin-bottom: 4px; overflow: hidden; }
        .app-icon svg { width: 26px; height: 26px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        .app-label { font-size: 10px; color: var(--text-secondary); }
        .bottom-dock { display: flex; justify-content: space-around; align-items: center; padding: 8px 12px 12px; background: var(--bg-color); border-top: 1px solid var(--border-color); min-height: 70px; }
        .dock-item { display: flex; flex-direction: column; align-items: center; width: 54px; cursor: pointer; background: transparent; border: none; }
        .dock-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--icon-bg); margin-bottom: 2px; }
        .dock-icon svg { width: 22px; height: 22px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .dock-icon img { width: 100%; height: 100%; object-fit: cover; }
        .dock-label { font-size: 9px; color: var(--text-secondary); }
        .app-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 100; display: flex; flex-direction: column; transition: transform 0.25s; }
        .overlay-hidden { transform: translateX(100%); pointer-events: none; }
        .overlay-header { display: flex; align-items: center; padding: 12px 10px 10px; border-bottom: 1px solid var(--border-color); background: var(--bg-color); flex-shrink: 0; }
        .back-button { font-size: 20px; background: transparent; border: none; cursor: pointer; color: #aaa; padding: 4px 10px; line-height: 1; }
        .overlay-title { font-size: 17px; font-weight: 600; color: #333; }
        .overlay-content { flex: 1; padding: 16px 14px 24px; overflow-y: auto; background: var(--bg-color); display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 12px; color: #333; }
        .setting-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; background: #fff; outline: none; color: #333; margin-bottom: 8px; }
        .setting-textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 13px; background: #fff; outline: none; color: #333; margin-bottom: 8px; min-height: 100px; resize: vertical; font-family: inherit; line-height: 1.5; }
        .save-button { background: #333; color: #fff; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; margin-top: 6px; }
        .save-button:active { background: #555; }
        .save-button.secondary { background: #f0f0f0; color: #333; }
        .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f5; cursor: pointer; font-size: 11px; text-align: center; transition: all 0.2s; color: #555; }
        .tab-btn.active { background: #333; color: #fff; border-color: #333; }
        .worldbook-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; border-radius: 8px; }
        .worldbook-item:active { background: #f5f5f5; }
        .worldbook-tag { font-size: 10px; padding: 2px 6px; border-radius: 8px; flex-shrink: 0; }
        .worldbook-tag.global { background: #eee; color: #555; }
        .worldbook-tag.single { background: #eee; color: #555; }
        .worldbook-tag.required { background: #ddd; color: #333; }
        .empty-state { text-align: center; color: #999; padding: 24px 16px; font-size: 13px; }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 300; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; border-radius: 14px; padding: 18px; width: 90%; max-width: 360px; max-height: 80%; overflow-y: auto; position: relative; }
        .modal-title { font-weight: 600; font-size: 15px; margin-bottom: 14px; color: #333; }
        .modal-close-btn { position: absolute; top: 8px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; line-height: 1; }
        .modal-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 8px; outline: none; }
        .modal-textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 8px; outline: none; min-height: 80px; resize: vertical; font-family: inherit; }
        .modal-btn { background: #333; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; margin: 3px 0; width: 100%; }
        .modal-btn.secondary { background: #f0f0f0; color: #333; }
        .chat-nav { display: flex; justify-content: space-around; align-items: center; padding: 6px 0 8px; background: #fff; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
        .chat-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; background: none; border: none; padding: 0 6px; }
        .chat-nav-icon { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
        .chat-nav-icon svg { width: 20px; height: 20px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .chat-nav-label { font-size: 9px; color: #888; }
        .chat-nav-item.active .chat-nav-icon svg { stroke: #333; }
        .chat-nav-item.active .chat-nav-label { color: #333; font-weight: 600; }
        .chat-page { display: none; flex: 1; padding: 12px 14px; overflow-y: auto; }
        .chat-page.active { display: block; }
        .chat-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .chat-avatar svg { width: 22px; height: 22px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-list-info { flex: 1; }
        .chat-list-name { font-weight: 600; font-size: 13px; color: #333; }
        .chat-list-preview { font-size: 11px; color: #999; margin-top: 2px; }
        .conversation-page { display: none; flex: 1; flex-direction: column; background: #fff; }
        .conversation-page.active { display: flex; }
        .conversation-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
        .conversation-header-left { display: flex; align-items: center; }
        .conversation-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; }
        .message-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
        .message-row.user { flex-direction: row-reverse; }
        .message-avatar { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #ddd; display: flex; align-items: center; justify-content: center; }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-avatar svg { width: 16px; height: 16px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .message-bubble { max-width: 80%; padding: 9px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .message-ai { background: #f0f0f0; color: #333; }
        .message-user { background: #333; color: #fff; }
        .conversation-input-area { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #f0f0f0; }
        .conversation-input { flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 18px; font-size: 13px; outline: none; }
        .conversation-send-btn { padding: 9px 14px; background: #333; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-size: 12px; }
        .conversation-ai-btn { padding: 9px 14px; background: #888; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-size: 12px; }
        .three-dots-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: #333; padding: 4px 6px; }
        .settings-page { display: none; flex: 1; padding: 12px 14px; overflow-y: auto; }
        .settings-page.active { display: block; }
        .toggle-switch { width: 36px; height: 20px; background: #ddd; border-radius: 10px; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; margin-top: 8px; }
        .toggle-switch.on { background: #333; }
        .toggle-switch::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.2s; }
        .toggle-switch.on::after { left: 18px; }
        .wallet-page { display: none; flex: 1; padding: 12px 14px; overflow-y: auto; background: #fff; }
        .wallet-page.active { display: block; }
        .wallet-balance-card { background: #fafafa; border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 14px; }
        .wallet-balance-label { font-size: 12px; color: #999; margin-bottom: 6px; }
        .wallet-balance-amount { font-size: 32px; font-weight: 700; color: #1a1a1a; }
        .wallet-menu-item { display: flex; align-items: center; gap: 10px; padding: 14px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .wallet-menu-icon { width: 32px; height: 32px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
        .wallet-menu-icon svg { width: 18px; height: 18px; stroke: #999; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .wallet-menu-label { font-size: 14px; color: #333; font-weight: 500; }
        .wallet-menu-desc { font-size: 11px; color: #999; margin-top: 2px; }
        .meituan-page, .shopping-page, .travel-page, .calendar-page, .sms-page, .couple-space-page { display: none; flex: 1; padding: 12px 14px; overflow-y: auto; background: #fff; }
        .meituan-page.active, .shopping-page.active, .travel-page.active, .calendar-page.active, .sms-page.active, .couple-space-page.active { display: block; }
        .meituan-item, .shopping-item, .travel-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; border-radius: 8px; }
        .meituan-item:active, .shopping-item:active, .travel-item:active { background: #f5f5f5; }
        .meituan-item-icon, .shopping-item-icon, .travel-item-icon { width: 48px; height: 48px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; color: #999; }
        .meituan-item-info, .shopping-item-info, .travel-item-info { flex: 1; }
        .meituan-item-name, .shopping-item-name, .travel-item-name { font-weight: 600; font-size: 14px; color: #333; }
        .meituan-item-desc, .shopping-item-desc, .travel-item-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .meituan-item-price, .shopping-item-price, .travel-item-price { font-weight: 700; font-size: 15px; color: #333; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .calendar-day:hover { background: #f0f0f0; }
        .calendar-day.today { background: #333; color: #fff; }
        .calendar-day.other-month { color: #ccc; }
        .calendar-weekday { text-align: center; font-size: 11px; color: #999; padding: 4px 0; }
        .sms-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .sms-item:active { background: #f5f5f5; }
        .sms-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; color: #999; }
        .sms-info { flex: 1; }
        .sms-name { font-weight: 600; font-size: 13px; color: #333; }
        .sms-preview { font-size: 11px; color: #999; margin-top: 2px; }
        .sms-time { font-size: 10px; color: #ccc; }
        .couple-space-header { text-align: center; padding: 20px 0; }
        .couple-space-avatars { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
        .couple-space-avatar { width: 64px; height: 64px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #999; border: 2px solid #fff; background-size: cover; background-position: center; }
        .couple-space-heart { font-size: 24px; color: #ccc; }
        .couple-space-days { font-size: 13px; color: #999; }
        .couple-space-feature { display: flex; align-items: center; gap: 10px; padding: 14px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .couple-space-feature-icon { width: 32px; height: 32px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
        .couple-space-feature-icon svg { width: 18px; height: 18px; stroke: #999; stroke-width: 1.5; fill: none; }
        .couple-space-feature-name { font-size: 14px; color: #333; font-weight: 500; }
        .couple-space-feature-desc { font-size: 11px; color: #999; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="phone-screen" id="phoneScreen">
        <div class="main-scroll-container" id="mainScroll">
            <div class="page" id="page1">
                <div class="top-spacer"></div>
                <div class="profile-card" id="profileCard">
                    <div class="profile-avatar-wrapper" id="avatarWrapper"><div class="profile-avatar" id="profileAvatar">A</div><input type="file" id="avatarInput" accept="image/*" style="display:none;"></div>
                    <div class="profile-info"><div class="profile-name" id="profileName">我的昵称</div><div class="profile-sub" id="profileSub">个性签名</div></div>
                    <div class="edit-badge" id="editProfileBtn">编辑</div>
                </div>
                <div class="couple-card" id="coupleCard" onclick="openCoupleSpace()">
                    <div class="couple-person" id="coupleLeft"><div class="couple-avatar" id="coupleAvatarLeft">L</div><div class="couple-name" id="coupleNameLeft">用户</div></div>
                    <div class="couple-heart"><svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
                    <div class="couple-person" id="coupleRight"><div class="couple-avatar" id="coupleAvatarRight">R</div><div class="couple-name" id="coupleNameRight">用户</div></div>
                </div>
                <div class="glass-component" id="glassComponent">
                    <div class="glass-text" id="glassText">记录此刻</div>
                    <div class="glass-image-area" id="glassImageArea">点击更换照片</div>
                    <input type="file" id="glassImageInput" accept="image/*" style="display:none;">
                </div>
                <div class="apps-grid" id="page1Apps"><div class="app-row" id="page1Row"></div></div>
            </div>
            <div class="page" id="page2"><div class="top-spacer"></div><div class="apps-grid" id="page2Apps"><div class="app-row" id="page2Row"></div></div></div>
        </div>
        <div class="bottom-dock" id="bottomDock"></div>

        <!-- 聊天覆盖层 -->
        <div id="overlay-chat" class="app-overlay overlay-hidden">
            <div class="overlay-header"><button class="back-button" onclick="closeApp('chat')">返回</button><span class="overlay-title">聊天</span></div>
            <div class="chat-page active" id="chatPage-chat"><div class="card"><div class="card-title">最近对话</div><div id="chatListContainer"></div></div></div>
            <div class="chat-page" id="chatPage-contacts"><div class="card"><div class="card-title">联系人</div><div id="contactsListContainer"></div></div><button class="save-button secondary" onclick="showAddAIModal()" style="margin-top:10px;">新增AI角色</button></div>
            <div class="chat-page" id="chatPage-moments"><div class="card"><div class="card-title">朋友圈</div><div class="chat-list-item"><div class="chat-avatar" id="momentsAvatar"></div><div class="chat-list-info"><div class="chat-list-name" id="momentsName">我的昵称</div><div class="chat-list-preview">分享生活...</div></div></div></div></div>
            <div class="chat-page" id="chatPage-me">
                <div class="card" style="margin-bottom:12px;">
                    <div class="card-title">我</div>
                    <div class="chat-list-item" onclick="showProfileModal()"><div class="chat-avatar" id="meAvatar"></div><div class="chat-list-info"><div class="chat-list-name" id="meName">我的昵称</div><div class="chat-list-preview" id="meSignature">个性签名</div></div></div>
                </div>
                <div class="card" style="margin-bottom:12px;">
                    <div class="card-title">功能</div>
                    <div class="chat-list-item" onclick="openWalletPage()"><div class="wallet-menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M16 14h2"/></svg></div><div class="chat-list-info"><div class="chat-list-name">钱包</div><div class="chat-list-preview">余额、银行卡、亲属卡</div></div></div>
                    <div class="chat-list-item" onclick="showMaskModal()"><div class="chat-list-info"><div class="chat-list-name">面具设置</div><div class="chat-list-preview">自定义头像、昵称、人设</div></div></div>
                </div>
            </div>
            <div class="conversation-page" id="conversationPage">

    <script>
        (function() {
            const appData = {

                'meituan': { name: '美团', svg: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' },

                'beauty': { name: '美化', svg: '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>' },
                'shopping': { name: '购物', svg: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>' },
                'forum': { name: '论坛', svg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
                'travel': { name: '出行', svg: '<rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>' },
                'phone': { name: '查手机', svg: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/><path d="M9 6h6"/><path d="M9 10h6"/>' }
            };

            let page1Apps = ['world', 'settings', 'doing', 'memory'];
            let page2Apps = ['meituan', 'couple', 'listen', 'calendar', 'shopping', 'forum', 'travel', 'phone'];
            let dockApps = ['chat', 'message', 'phone', 'beauty'];
            let customIcons = {};
            let wallpaperUrl = '';
            let userAvatar = '';
            let userName = '我的昵称';
            let userSignature = '个性签名';
            let remarkName = '测试AI';
            let showAIAvatar = true;
            let showUserAvatar = true;
            let bubbleCSS = '';
            let walletBalance = 0;
            let bankCards = [];
            let relativeCards = [];
            let masks = [];
            let customAIs = [];
            let currentAIAvatar = '';
            let globalApiConfig = { url: '', key: '', model: '', temperature: 0.7 };
            let coupleLeftAvatar = '';
            let coupleRightAvatar = '';
            let coupleLeftName = '用户';
            let coupleRightName = '用户';
            let glassImageUrl = '';
            let glassText = '记录此刻';
            let worldbooks = [];
            let currentWorldbookTab = 'all';
            let smsMessages = [];
            let travelTab = 'plane';
            let calendarDate = new Date();
            let meituanItems = [];
            let shoppingItems = [];

            function safeGet(key, def) { try { const v = localStorage.getItem(key); return v !== null ? v : def; } catch(e) { return def; } }
            function safeSet(key, val) { try { localStorage.setItem(key, val); return true; } catch(e) { return false; } }
            function safeParse(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }

            function loadConfig() {
                const saved = safeParse('app_layout_config', null);
                if (saved) { page1Apps = saved.page1Apps || page1Apps; page2Apps = saved.page2Apps || page2Apps; dockApps = saved.dockApps || dockApps; }
                customIcons = safeParse('custom_icons', {});
                wallpaperUrl = safeGet('wallpaper', '');
                userAvatar = safeGet('userAvatar', '');
                userName = safeGet('userName', '我的昵称');
                userSignature = safeGet('userSignature', '个性签名');
                walletBalance = parseFloat(safeGet('walletBalance', '0'));
                bankCards = safeParse('bankCards', []);
                relativeCards = safeParse('relativeCards', []);
                masks = safeParse('masks', []);
                customAIs = safeParse('customAIs', []);
                globalApiConfig = safeParse('globalApiConfig', { url: '', key: '', model: '', temperature: 0.7 });
                coupleLeftAvatar = safeGet('coupleLeftAvatar', '');
                coupleRightAvatar = safeGet('coupleRightAvatar', '');
                coupleLeftName = safeGet('coupleLeftName', '用户');
                coupleRightName = safeGet('coupleRightName', '用户');
                glassImageUrl = safeGet('glassImageUrl', '');
                glassText = safeGet('glassText', '记录此刻');
                worldbooks = safeParse('worldbooks', []);
                smsMessages = safeParse('smsMessages', []);
                removeDockAppsFromPages();
                applyWallpaper();
                updateUserDisplay();
                updateCoupleDisplay();
                updateGlassDisplay();
                renderChatLists();
                renderWorldbooks();
                updateWalletDisplay();
                renderSMSList();
                initMeituanItems();
                initShoppingItems();
                renderCalendar();
            }

            function saveConfig() {
                removeDockAppsFromPages();
                safeSet('app_layout_config', JSON.stringify({page1Apps, page2Apps, dockApps}));
                safeSet('custom_icons', JSON.stringify(customIcons));
                safeSet('wallpaper', wallpaperUrl);
                safeSet('userAvatar', userAvatar);
                safeSet('userName', userName);
                safeSet('userSignature', userSignature);
                safeSet('walletBalance', walletBalance.toString());
                safeSet('bankCards', JSON.stringify(bankCards));
                safeSet('relativeCards', JSON.stringify(relativeCards));
                safeSet('masks', JSON.stringify(masks));
                safeSet('customAIs', JSON.stringify(customAIs));
                safeSet('globalApiConfig', JSON.stringify(globalApiConfig));
                safeSet('coupleLeftAvatar', coupleLeftAvatar);
                safeSet('coupleRightAvatar', coupleRightAvatar);
                safeSet('coupleLeftName', coupleLeftName);
                safeSet('coupleRightName', coupleRightName);
                safeSet('glassImageUrl', glassImageUrl);
                safeSet('glassText', glassText);
                safeSet('worldbooks', JSON.stringify(worldbooks));
                safeSet('smsMessages', JSON.stringify(smsMessages));
            }

            function removeDockAppsFromPages() {
                page1Apps = page1Apps.filter(id => !dockApps.includes(id));
                page2Apps = page2Apps.filter(id => !dockApps.includes(id));
            }

            function applyWallpaper() {
                const ps = document.getElementById('phoneScreen');
                const ms = document.getElementById('mainScroll');
                const pages = document.querySelectorAll('.page');
                const bd = document.getElementById('bottomDock');
                if (wallpaperUrl) {
                    ps.style.backgroundImage = `url("${wallpaperUrl}")`;
                    ps.style.backgroundSize = 'cover';
                    ms.style.background = 'transparent';
                    pages.forEach(p => p.style.background = 'transparent');
                    bd.style.background = 'rgba(255,255,255,0.85)';
                } else {
                    ps.style.backgroundImage = '';
                    ps.style.background = '#fff';
                    ms.style.background = '#fff';
                    pages.forEach(p => p.style.background = '#fff');
                    bd.style.background = '#fff';
                }
            }

            function updateUserDisplay() {
                document.getElementById('profileName').textContent = userName;
                document.getElementById('profileSub').textContent = userSignature;
                const profileAvatar = document.getElementById('profileAvatar');
                if (userAvatar) { profileAvatar.style.backgroundImage = `url("${userAvatar}")`; profileAvatar.textContent = ''; }
                else { profileAvatar.style.backgroundImage = ''; profileAvatar.textContent = 'A'; }
                document.getElementById('meName').textContent = userName;
                document.getElementById('meSignature').textContent = userSignature;
                const meAvatar = document.getElementById('meAvatar');
                if (userAvatar) { meAvatar.innerHTML = `<img src="${userAvatar}">`; }
                else { meAvatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'; }
                const momentsAvatar = document.getElementById('momentsAvatar');
                if (userAvatar) { momentsAvatar.innerHTML = `<img src="${userAvatar}">`; }
                else { momentsAvatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'; }
                document.getElementById('momentsName').textContent = userName;
            }

            function updateCoupleDisplay() {
                const leftAvatar = document.getElementById('coupleAvatarLeft');
                const rightAvatar = document.getElementById('coupleAvatarRight');
                if (coupleLeftAvatar) { leftAvatar.style.backgroundImage = `url("${coupleLeftAvatar}")`; leftAvatar.textContent = ''; }
                else { leftAvatar.style.backgroundImage = ''; leftAvatar.textContent = 'L'; }
                if (coupleRightAvatar) { rightAvatar.style.backgroundImage = `url("${coupleRightAvatar}")`; rightAvatar.textContent = ''; }
                else { rightAvatar.style.backgroundImage = ''; rightAvatar.textContent = 'R'; }
                document.getElementById('coupleNameLeft').textContent = coupleLeftName;
                document.getElementById('coupleNameRight').textContent = coupleRightName;
            }

            function updateGlassDisplay() {
                document.getElementById('glassText').textContent = glassText;
                const imageArea = document.getElementById('glassImageArea');
                if (glassImageUrl) { imageArea.style.backgroundImage = `url("${glassImageUrl}")`; imageArea.textContent = ''; }
                else { imageArea.style.backgroundImage = ''; imageArea.textContent = '点击更换照片'; }
            }

            function updateWalletDisplay() {
                const el = document.getElementById('walletBalanceDisplay');
                if (el) el.textContent = walletBalance.toFixed(2);
            }

            function getAvailableCharacters() {
                return ['测试AI', ...customAIs.map(ai => ai.name)];
            }

            function getApplicableWorldbooks(characterName) {
                return worldbooks.filter(wb => {
                    if (wb.isRequired) return true;
                    if (wb.injectionType === 'global') return true;
                    if (wb.injectionType === 'single' && wb.targetCharacter === characterName) return true;
                    return false;
                });
            }

            function renderWorldbooks() {
                const container = document.getElementById('worldbookList');
                if (!container) return;
                container.innerHTML = '';
                const filtered = worldbooks.filter(wb => {
                    if (currentWorldbookTab === 'all') return true;
                    if (currentWorldbookTab === 'global') return wb.injectionType === 'global';
                    if (currentWorldbookTab === 'single') return wb.injectionType === 'single';
                    if (currentWorldbookTab === 'required') return wb.isRequired;
                    return true;
                });

            function renderCalendar() {
                const container = document.getElementById('calendarContent');
                if (!container) return;
                const year = calendarDate.getFullYear();
                const month = calendarDate.getMonth();
                const today = new Date();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();
                const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                
                document.getElementById('calendarMonthDisplay').textContent = `${year}年${monthNames[month]}`;
                
                let html = '<div class="card"><div class="card-title">' + year + '年' + monthNames[month] + '</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">';
                weekdays.forEach(d => { html += `<div class="calendar-weekday">${d}</div>`; });
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="calendar-day other-month">${daysInPrevMonth - firstDay + 1 + i}</div>`;
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                    html += `<div class="calendar-day ${isToday ? 'today' : ''}">${d}</div>`;
                }
                const totalCells = firstDay + daysInMonth;
                const remainingCells = 7 - (totalCells % 7);
                if (remainingCells < 7) {
                    for (let d = 1; d <= remainingCells; d++) {
                        html += `<div class="calendar-day other-month">${d}</div>`;
                    }
                }
                html += '</div><div style="display:flex;justify-content:space-between;margin-top:10px;"><button class="save-button secondary" style="width:auto;padding:8px 12px;" onclick="prevMonth()">上月</button><button class="save-button secondary" style="width:auto;padding:8px 12px;" onclick="nextMonth()">下月</button></div></div>';
                container.innerHTML = html;
            }

            window.prevMonth = function() { calendarDate.setMonth(calendarDate.getMonth() - 1); renderCalendar(); };
            window.nextMonth = function() { calendarDate.setMonth(calendarDate.getMonth() + 1); renderCalendar(); };

                const allSMS = smsMessages.length > 0 ? smsMessages : defaultSMS;
                allSMS.forEach(sms => {
                    const div = document.createElement('div');
                    div.className = 'sms-item';
                    div.innerHTML = `
                        <div class="sms-avatar">${sms.from.charAt(0)}</div>
                        <div class="sms-info">
                            <div class="sms-name">${sms.from}</div>
                            <div class="sms-preview">${sms.content}</div>
                        </div>
                        <div class="sms-time">${sms.time}</div>
                    `;
                    div.addEventListener('click', () => showModal(sms.from, `<div style="font-size:13px;line-height:1.6;">${sms.content}</div><div style="font-size:11px;color:#999;margin-top:8px;">${sms.time}</div>`));
                    list.appendChild(div);
                });
                if (allSMS.length === 0) {
                    list.innerHTML = '<div class="empty-state">暂无短信</div>';
                }
            }

            window.sendNewSMS = function() {
                showModal('新建短信', `
                    <label>收件人</label>
                    <input type="text" class="modal-input" id="smsTo" placeholder="输入收件人">
                    <label>内容</label>
                    <textarea class="modal-textarea" id="smsContent" placeholder="输入短信内容"></textarea>
                    <button class="modal-btn" onclick="sendSMS()">发送</button>
                `);
            };

            window.sendSMS = function() {
                const to = document.getElementById('smsTo').value.trim();
                const content = document.getElementById('smsContent').value.trim();
                if (!to || !content) { alert('请填写完整'); return; }
                smsMessages.push({ from: to, content: content, time: new Date().toLocaleTimeString().substring(0,5) });
                saveConfig();
                renderSMSList();
                closeModal();
            };

            window.openWalletPage = function() {
                document.querySelectorAll('.chat-page').forEach(p => p.classList.remove('active'));
                document.getElementById('conversationPage').classList.remove('active');
                document.getElementById('conversationSettingsPage').classList.remove('active');
                document.getElementById('walletPage').classList.add('active');
                document.getElementById('chatNav').style.display = 'none';
                document.querySelector('#overlay-chat .overlay-header').style.display = 'none';
                updateWalletDisplay();
            };

            window.closeWalletPage = function() {
                document.getElementById('walletPage').classList.remove('active');
                document.getElementById('chatPage-me').classList.add('active');
                document.getElementById('chatNav').style.display = 'flex';
                document.querySelector('#overlay-chat .overlay-header').style.display = 'flex';
            };

            window.openConversation = function(name, avatar) {
                remarkName = name;
                currentAIAvatar = avatar || '';
                document.getElementById('conversationTitle').textContent = remarkName;
                document.querySelectorAll('.chat-page').forEach(p => p.classList.remove('active'));
                document.getElementById('walletPage').classList.remove('active');
                document.getElementById('conversationPage').classList.add('active');
                document.getElementById('conversationSettingsPage').classList.remove('active');
                document.getElementById('chatNav').style.display = 'none';
                document.querySelector('#overlay-chat .overlay-header').style.display = 'none';
                document.getElementById('conversationMessages').innerHTML = `
                    <div class="message-row ai">
                        <div class="message-avatar">${currentAIAvatar ? `<img src="${currentAIAvatar}">` : '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'}</div>
                        <div class="message-bubble message-ai">你好，我是${name}</div>
                    </div>
                `;
            };

            window.closeConversation = function() {
                document.getElementById('conversationPage').classList.remove('active');
                document.getElementById('conversationSettingsPage').classList.remove('active');
                document.getElementById('chatPage-chat').classList.add('active');
                document.getElementById('chatNav').style.display = 'flex';
                document.querySelector('#overlay-chat .overlay-header').style.display = 'flex';
                renderChatLists();
            };

            window.showConversationSettings = function() {
                document.getElementById('conversationPage').classList.remove('active');
                document.getElementById('conversationSettingsPage').classList.add('active');
                document.getElementById('remarkInput').value = remarkName;
                document.getElementById('bubbleCSSInput').value = bubbleCSS;
                document.getElementById('toggleShowAIAvatar').classList.toggle('on', showAIAvatar);
                document.getElementById('toggleShowUserAvatar').classList.toggle('on', showUserAvatar);
            };

            window.backToConversation = function() {
                document.getElementById('conversationSettingsPage').classList.remove('active');
                document.getElementById('conversationPage').classList.add('active');
            };

            window.saveRemark = function() {
                const val = document.getElementById('remarkInput').value.trim();
                if(val) { remarkName = val; document.getElementById('conversationTitle').textContent = remarkName; renderChatLists(); }
            };

            window.saveBubbleCSS = function() { bubbleCSS = document.getElementById('bubbleCSSInput').value.trim(); };

            window.sendUserMessage = function() {
                const input = document.getElementById('conversationInput');
                const messages = document.getElementById('conversationMessages');
                const text = input.value.trim();
                if (!text) return;
                const row = document.createElement('div');
                row.className = 'message-row user';
                const avatarHtml = showUserAvatar ? (userAvatar ? `<div class="message-avatar"><img src="${userAvatar}"></div>` : '<div class="message-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>') : '';
                row.innerHTML = avatarHtml + `<div class="message-bubble message-user">${text}</div>`;
                messages.appendChild(row);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
            };

            window.sendAIReply = function() {
                const messages = document.getElementById('conversationMessages');
                const applicable = getApplicableWorldbooks(remarkName);
                const worldbookContext = applicable.map(wb => wb.content).join('\n\n');
                const replyText = worldbookContext ? '[已加载世界书]\n' + worldbookContext.substring(0, 200) + '...' : '这是AI的回复';
                const row = document.createElement('div');
                row.className = 'message-row ai';
                const avatarHtml = showAIAvatar ? (currentAIAvatar ? `<div class="message-avatar"><img src="${currentAIAvatar}"></div>` : '<div class="message-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>') : '';
                row.innerHTML = avatarHtml + `<div class="message-bubble message-ai">${replyText}</div>`;
                messages.appendChild(row);
                messages.scrollTop = messages.scrollHeight;
            };

            window.toggleSwitch = function(el) {
                el.classList.toggle('on');
                if(el.id === 'toggleShowAIAvatar') showAIAvatar = el.classList.contains('on');
                if(el.id === 'toggleShowUserAvatar') showUserAvatar = el.classList.contains('on');
                saveConfig();
            };

            function showModal(title, content) {
                document.getElementById('modalContent').innerHTML = `<div class="modal-close-btn" onclick="closeModal()">x</div><div class="modal-title">${title}</div>${content}`;
                document.getElementById('modalOverlay').classList.add('active');
            }

            window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('active'); };
            document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target === document.getElementById('modalOverlay')) closeModal(); });

            window.showProfileModal = function() {
                showModal('个人资料', `
                    <label>头像</label>
                    <input type="file" class="modal-input" id="profileAvatarInput" accept="image/*">
                    <label>昵称</label>
                    <input type="text" class="modal-input" id="profileNameInput" value="${userName}">
                    <label>签名</label>
                    <input type="text" class="modal-input" id="profileSigInput" value="${userSignature}">
                    <button class="modal-btn" onclick="saveProfile()">保存</button>
                `);
                document.getElementById('profileAvatarInput').addEventListener('change', e => {
                    const f = e.target.files[0];
                    if(f) { const r = new FileReader(); r.onload = ev => { userAvatar = ev.target.result; }; r.readAsDataURL(f); }
                });
            };

            window.saveProfile = function() {
                userName = document.getElementById('profileNameInput').value.trim() || userName;
                userSignature = document.getElementById('profileSigInput').value.trim() || userSignature;
                updateUserDisplay();
                saveConfig();
                closeModal();
            };

            window.showBankCardPage = function() {
                const list = bankCards.length > 0 ? bankCards.map((c, i) => `<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px;">${c.type} ${c.name} ${c.cardNumber}</div>`).join('') : '<div class="empty-state">暂无银行卡</div>';
                showModal('银行卡', `${list}<button class="modal-btn secondary" onclick="addBankCard()">添加银行卡</button>`);
            };

            window.addBankCard = function() {
                const type = prompt('银行卡类型');
                const name = prompt('持卡人姓名');
                const cardNumber = prompt('卡号');
                if(type && name && cardNumber) { bankCards.push({type, name, cardNumber}); saveConfig(); showBankCardPage(); }
            };

            window.showRelativeCardPage = function() {
                const list = relativeCards.length > 0 ? relativeCards.map(c => `<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px;">${c.from} 额度: ${c.limit} 已用: ${c.used}</div>`).join('') : '<div class="empty-state">暂无亲属卡</div>';
                showModal('亲属卡', `${list}<button class="modal-btn secondary" onclick="aiGenerateRelativeCard()">生成亲属卡</button>`);
            };

            window.aiGenerateRelativeCard = function() {
                relativeCards.push({from: '测试AI', limit: Math.floor(Math.random() * 5000), used: 0});
                saveConfig();
                showRelativeCardPage();
            };

            window.aiGenerateBalance = function() {
                walletBalance = Math.floor(Math.random() * 10000);
                saveConfig();
                updateWalletDisplay();
                closeModal();
            };

            window.showAddAIModal = function() {
                showModal('新增AI角色', `
                    <label>头像</label>
                    <input type="file" class="modal-input" id="aiAvatarInput" accept="image/*">
                    <label>名字</label>
                    <input type="text" class="modal-input" id="aiNameInput">
                    <label>网名</label>
                    <input type="text" class="modal-input" id="aiNicknameInput">
                    <label>身份</label>
                    <input type="text" class="modal-input" id="aiIdentityInput">
                    <label>性别</label>
                    <select class="modal-input" id="aiGenderInput"><option>男</option><option>女</option><option>其他</option></select>
                    <label>年龄</label>
                    <input type="number" class="modal-input" id="aiAgeInput">
                    <label>人设</label>
                    <textarea class="modal-input" id="aiPersonaInput" style="height:60px;"></textarea>
                    <button class="modal-btn" onclick="saveNewAI()">保存</button>
                `);
            };

            window.saveNewAI = function() {
                const avatarFile = document.getElementById('aiAvatarInput').files[0];
                const addAI = (avatarData) => {
                    customAIs.push({
                        name: document.getElementById('aiNameInput').value || 'AI',
                        avatar: avatarData,
                        nickname: document.getElementById('aiNicknameInput').value,
                        identity: document.getElementById('aiIdentityInput').value,
                        gender: document.getElementById('aiGenderInput').value,
                        age: document.getElementById('aiAgeInput').value,
                        persona: document.getElementById('aiPersonaInput').value
                    });
                    saveConfig();
                    renderChatLists();
                    closeModal();
                };
                if(avatarFile) { const r = new FileReader(); r.onload = e => addAI(e.target.result); r.readAsDataURL(avatarFile); }
                else { addAI(''); }
            };

            window.showMaskModal = function() {
                showModal('面具设置', `
                    <label>头像(可选)</label>
                    <input type="file" class="modal-input" id="maskAvatarInput" accept="image/*">
                    <label>名字</label>
                    <input type="text" class="modal-input" id="maskNameInput">
                    <label>网名</label>
                    <input type="text" class="modal-input" id="maskNicknameInput">
                    <label>人设</label>
                    <input type="text" class="modal-input" id="maskPersonaInput">
                    <label>性别</label>
                    <select class="modal-input" id="maskGenderInput"><option>男</option><option>女</option><option>其他</option></select>
                    <button class="modal-btn" onclick="saveMask()">保存</button>
                `);
            };

            window.saveMask = function() {
                const avatar = document.getElementById('maskAvatarInput').files[0];
                const addMask = (avatarData) => {
                    masks.push({ avatar: avatarData, name: document.getElementById('maskNameInput').value, nickname: document.getElementById('maskNicknameInput').value, persona: document.getElementById('maskPersonaInput').value, gender: document.getElementById('maskGenderInput').value });
                    saveConfig();
                    closeModal();
                };
                if(avatar) { const r = new FileReader(); r.onload = e => addMask(e.target.result); r.readAsDataURL(avatar); }
                else { addMask(userAvatar); }
            };

            window.saveBeautySettings = function() { saveConfig(); alert('已保存'); };
            window.testGlobalApi = function() { alert('测试成功(模拟)'); };
            window.saveApiSettings = function() { globalApiConfig.url = document.getElementById('apiUrl').value; globalApiConfig.key = document.getElementById('apiKey').value; saveConfig(); alert('已保存'); };
            window.fetchModels = function(type) {
                showModal('选择模型', `<div>${['gpt-4o','gpt-4-turbo','gpt-3.5-turbo','claude-3.5-sonnet','gemini-1.5-pro'].map(m => `<button class="modal-btn" onclick="selectModel('${m}')">${m}</button>`).join('')}</div>`);
            };
            window.selectModel = function(model) { globalApiConfig.model = model; saveConfig(); closeModal(); alert('已选择: ' + model); };

            document.getElementById('avatarWrapper').addEventListener('click', () => document.getElementById('avatarInput').click());
            document.getElementById('avatarInput').addEventListener('change', e => {
                const f = e.target.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = ev => { userAvatar = ev.target.result; updateUserDisplay(); saveConfig(); };
                r.readAsDataURL(f);
            });
            document.getElementById('profileName').addEventListener('click', () => { const n = prompt('修改昵称'); if(n) { userName = n; updateUserDisplay(); saveConfig(); } });
            document.getElementById('profileSub').addEventListener('click', () => { const n = prompt('修改签名'); if(n) { userSignature = n; updateUserDisplay(); saveConfig(); } });
            document.getElementById('editProfileBtn').addEventListener('click', () => { const n = prompt('修改昵称'); if(n) { userName = n; updateUserDisplay(); saveConfig(); } });

            document.getElementById('coupleLeft').addEventListener('click', () => {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
                inp.onchange = e => { const f = e.target.files[0]; if(f) { const r = new FileReader(); r.onload = ev => { coupleLeftAvatar = ev.target.result; updateCoupleDisplay(); saveConfig(); }; r.readAsDataURL(f); } };
                inp.click();
            });
            document.getElementById('coupleRight').addEventListener('click', () => {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
                inp.onchange = e => { const f = e.target.files[0]; if(f) { const r = new FileReader(); r.onload = ev => { coupleRightAvatar = ev.target.result; updateCoupleDisplay(); saveConfig(); }; r.readAsDataURL(f); } };
                inp.click();
            });
            document.getElementById('coupleNameLeft').addEventListener('click', () => { const n = prompt('修改昵称'); if(n) { coupleLeftName = n; updateCoupleDisplay(); saveConfig(); } });
            document.getElementById('coupleNameRight').addEventListener('click', () => { const n = prompt('修改昵称'); if(n) { coupleRightName = n; updateCoupleDisplay(); saveConfig(); } });

            document.getElementById('glassText').addEventListener('click', () => { const t = prompt('修改文字'); if(t) { glassText = t; updateGlassDisplay(); saveConfig(); } });
            document.getElementById('glassImageArea').addEventListener('click', () => document.getElementById('glassImageInput').click());
            document.getElementById('glassImageInput').addEventListener('change', e => {
                const f = e.target.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = ev => { glassImageUrl = ev.target.result; updateGlassDisplay(); saveConfig(); };
                r.readAsDataURL(f);
            });

            const chatNavItems = document.querySelectorAll('.chat-nav-item');
            const chatPages = document.querySelectorAll('.chat-page');
            chatNavItems.forEach(item => {
                item.addEventListener('click', () => {
                    const pageId = item.dataset.page;
                    chatNavItems.forEach(n => n.classList.remove('active'));
                    chatPages.forEach(p => p.classList.remove('active'));
                    document.getElementById('conversationPage').classList.remove('active');
                    document.getElementById('conversationSettingsPage').classList.remove('active');
                    document.getElementById('walletPage').classList.remove('active');
                    document.getElementById('chatNav').style.display = 'flex';
                    document.querySelector('#overlay-chat .overlay-header').style.display = 'flex';
                    item.classList.add('active');
                    document.getElementById(pageId).classList.add('active');
                });
            });

            document.getElementById('wallpaperInput')?.addEventListener('change', e => {
                const f = e.target.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = ev => { wallpaperUrl = ev.target.result; applyWallpaper(); saveConfig(); };
                r.readAsDataURL(f);
            });

            loadConfig();
            renderApps();
            updateUserDisplay();
            updateCoupleDisplay();
            updateGlassDisplay();
            renderChatLists();
            renderWorldbooks();
            updateWalletDisplay();
            renderSMSList();
            initMeituanItems();
            initShoppingItems();
            renderCalendar();
        })();
    </script>
</body>
</html>
