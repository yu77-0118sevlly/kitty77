<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WUYO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="moments/moments.css">
    <!-- 依赖外置的 CSS 文件 -->
    <link rel="stylesheet" href="calendar/calendar.css">
</head>
<body>
    
    <!-- 全局隐藏的图片上传器 -->
    <input type="file" id="image-uploader" accept="image/*" style="display: none !important; opacity: 0; position: absolute; z-index: -999; width: 0; height: 0; overflow: hidden;">

    <!-- 主屏幕容器 -->
    <main id="home-screen">
        <div class="home-page">
            <header class="top-header">
                <div class="header-left">
                    <span class="brand-name">WUYO</span>
                    <span class="day" id="current-day">星期四</span>
                    <span class="date" id="current-date">9月3日</span>
                </div>
                <div class="profile-widget uploadable" id="profile-pic" aria-label="更换头像"><i data-lucide="user" class="placeholder-icon"></i></div>
            </header>
            <section id="custom-widget-area" class="custom-widget-area" aria-label="自定义小组件"></section>
            <section class="app-grid" id="home-app-grid" aria-label="应用"></section>
        </div>
        <nav id="dock" aria-label="快捷应用">
            <div class="dock-container">
                <button class="dock-item" type="button" data-app-id="contacts" aria-label="联系人"><i data-lucide="users"></i></button>
                <button class="dock-item" type="button" data-app-id="chat" aria-label="聊天"><i data-lucide="message-square"></i></button>
                <button class="dock-item" type="button" data-app-id="settings" aria-label="设置"><i data-lucide="settings"></i></button>
            </div>
        </nav>
    </main>

    <!-- SPA 应用的独立容器 -->
    <section id="beautify-app" class="app-view" style="display: none;"></section>
    <section id="chat-app" class="app-view" style="display: none;"></section>
    <section id="settings-app" class="app-view" style="display: none;"></section>
    <section id="worldbook-app" class="app-view" style="display: none;"></section>
    
    <!-- 💥 纯正苹果风格日历容器 -->
    <section id="calendar-app" class="app-view" style="display: none;">
        <div class="calendar-app" id="calendar-app-main">
            <!-- 顶部工具栏 (仿 iOS) -->
            <header class="cal-ios-header">
                <button class="cal-ios-back" onclick="window.closeCalendar()">
                    <i data-lucide="chevron-left"></i> <span id="cal-year-title">2026年</span>
                </button>
                <div class="cal-ios-tools">
                    <i data-lucide="layout-list"></i>
                    <i data-lucide="search"></i>
                    <i data-lucide="plus"></i>
                </div>
            </header>

            <!-- 月份大标题 -->
            <div class="cal-ios-title-row">
                <h1 id="cal-month-large-title">九月</h1>
            </div>

            <!-- 星期表头 -->
            <div class="cal-ios-weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>

            <!-- 滑动网格区 -->
            <div class="cal-ios-scroll-area" id="cal-scroll-area">
                <div class="cal-ios-grid" id="cal-days-grid"></div>
            </div>

            <!-- 底部 Tab -->
            <footer class="cal-ios-tabbar">
                <button id="cal-today-btn">今天</button>
                <button style="font-weight: 600;">日历</button>
                <button>收件箱</button>
            </footer>
        </div>
    </section>

    <script src="app.js"></script>
    <script src="calendar/calendar.js"></script>

</body>
</html>
