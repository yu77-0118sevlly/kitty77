<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 全屏锁定与添加到桌面 (PWA) 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="无忧机">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f7f7f9">
    
    <title>无忧机</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- 顶部状态栏 -->
    <header id="status-bar">
        <div class="time" id="clock">09:41</div>
        <div class="status-right">
            <!-- 最右上角的专属名称 -->
            <span class="brand-name">WU YO</span>
            <div class="status-icons">
                <i data-lucide="bar-chart-2"></i>
                <i data-lucide="wifi"></i>
                <i data-lucide="battery-medium"></i>
            </div>
        </div>
    </header>

    <!-- 视图容器 (用于页面切换) -->
    <main id="view-container">
        
        <!-- 1. 首页视图 -->
        <section id="view-home" class="view active">
            <div class="home-scroll-area">
                
                <!-- 顶部日期与用户头像 -->
                <div class="header-section">
                    <div class="date-display">
                        <span class="day" id="current-day">星期三</span>
                        <span class="date" id="current-date">10月25日</span>
                    </div>
                    <div class="user-avatar-card">
                        <i data-lucide="user" class="avatar-icon"></i>
                    </div>
                </div>

                <!-- 拍立得风格装饰卡片 -->
                <div class="polaroid-decoration">
                    <div class="polaroid-photo">
                        <i data-lucide="image" class="placeholder-icon"></i>
                    </div>
                    <div class="polaroid-text">Memory</div>
                </div>

                <!-- AI 角色信息卡 -->
                <div class="ai-card">
                    <div class="ai-avatar">
                        <i data-lucide="bot"></i>
                    </div>
                    <div class="ai-info">
                        <h2>AI 伴侣</h2>
                        <p>随时准备与你交流...</p>
                    </div>
                </div>

                <!-- App 桌面网格 (已扩充) -->
                <div class="app-grid">
                    <div class="app-item" data-target="view-chat">
                        <div class="app-icon"><i data-lucide="message-square"></i></div>
                        <span>聊天</span>
                    </div>
                    <div class="app-item" data-target="view-worldbook">
                        <div class="app-icon"><i data-lucide="book"></i></div>
                        <span>世界书</span>
                    </div>
                    <div class="app-item" data-target="view-theme">
                        <div class="app-icon"><i data-lucide="palette"></i></div>
                        <span>美化</span>
                    </div>
                    <div class="app-item" data-target="view-photos">
                        <div class="app-icon"><i data-lucide="image"></i></div>
                        <span>相册</span>
                    </div>
                    <div class="app-item" data-target="view-notes">
                        <div class="app-icon"><i data-lucide="file-text"></i></div>
                        <span>备忘录</span>
                    </div>
                    <div class="app-item" data-target="view-music">
                        <div class="app-icon"><i data-lucide="music"></i></div>
                        <span>音乐</span>
                    </div>
                    <div class="app-item" data-target="view-calendar">
                        <div class="app-icon"><i data-lucide="calendar"></i></div>
                        <span>日历</span>
                    </div>
                    <div class="app-item" data-target="view-settings">
                        <div class="app-icon"><i data-lucide="settings"></i></div>
                        <span>设置</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 聊天视图 -->
        <section id="view-chat" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">聊天</span>
                <button class="icon-btn"><i data-lucide="more-horizontal"></i></button>
            </div>
            <div class="page-content">
                <div class="message received">
                    <div class="msg-bubble">你好，今天过得怎么样？</div>
                </div>
            </div>
        </section>

        <!-- 3. 世界书视图 -->
        <section id="view-worldbook" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">世界书</span>
                <button class="icon-btn"><i data-lucide="plus"></i></button>
            </div>
            <div class="page-content">
                <!-- 预留世界书条目列表 -->
            </div>
        </section>

        <!-- 4. 个性美化视图 -->
        <section id="view-theme" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">个性美化</span>
                <div class="icon-btn-placeholder"></div>
            </div>
            <div class="page-content">
                <!-- 预留美化选项 -->
            </div>
        </section>

        <!-- 5. 相册视图 -->
        <section id="view-photos" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">相册</span>
                <button class="icon-btn"><i data-lucide="search"></i></button>
            </div>
            <div class="page-content">
                <!-- 预留相册内容 -->
            </div>
        </section>

        <!-- 6. 备忘录视图 -->
        <section id="view-notes" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">备忘录</span>
                <button class="icon-btn"><i data-lucide="edit"></i></button>
            </div>
            <div class="page-content">
                <!-- 预留备忘录内容 -->
            </div>
        </section>

        <!-- 7. 音乐视图 -->
        <section id="view-music" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">音乐</span>
                <button class="icon-btn"><i data-lucide="play-circle"></i></button>
            </div>
            <div class="page-content">
                <!-- 预留音乐内容 -->
            </div>
        </section>

        <!-- 8. 日历视图 -->
        <section id="view-calendar" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">日历</span>
                <button class="icon-btn"><i data-lucide="calendar-plus"></i></button>
            </div>
            <div class="page-content">
                <!-- 预留日历内容 -->
            </div>
        </section>

        <!-- 9. 设置视图 -->
        <section id="view-settings" class="view">
            <div class="nav-bar">
                <button class="icon-btn back-btn" data-target="view-home">
                    <i data-lucide="chevron-left"></i>
                </button>
                <span class="nav-title">设置</span>
                <div class="icon-btn-placeholder"></div>
            </div>
            <div class="page-content">
                <!-- 预留设置选项 -->
            </div>
        </section>

    </main>

    <!-- 底部半透明 Dock 栏 -->
    <nav id="dock">
        <div class="dock-container">
            <div class="dock-item" data-target="view-home"><i data-lucide="phone"></i></div>
            <div class="dock-item" data-target="view-home"><i data-lucide="users"></i></div>
            <div class="dock-item" data-target="view-chat"><i data-lucide="message-circle"></i></div>
            <div class="dock-item" data-target="view-theme"><i data-lucide="layout-grid"></i></div>
        </div>
    </nav>

    <!-- 底部操作条 (Home Indicator) -->
    <div id="home-indicator">
        <div class="indicator-bar" data-target="view-home"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
